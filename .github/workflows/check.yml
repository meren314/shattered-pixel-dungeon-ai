name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Client tests
        shell: pwsh
        run: |
          python -m unittest discover -s ai-probe/tests -p test_protocol_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s ai-probe/tests -p test_player_client.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s ai-probe/tests -p test_context_tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source publication check
        run: python tools/verify_source.py
      - name: Build desktop
        run: .\gradlew.bat :desktop:installDist --console=plain
      - name: HTTP boundary tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/policy-tests | Out-Null
          javac -d build/policy-tests desktop/src/main/java/com/shatteredpixel/shatteredpixeldungeon/desktop/ProbeHttpPolicy.java ai-probe/tests/ProbeHttpPolicyTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp build/policy-tests com.shatteredpixel.shatteredpixeldungeon.desktop.ProbeHttpPolicyTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          javac -cp "desktop/build/install/desktop/lib/*" -d build/policy-tests ai-probe/tests/ProbeRoutingTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp "build/policy-tests;desktop/build/install/desktop/lib/*" com.shatteredpixel.shatteredpixeldungeon.desktop.ProbeRoutingTest
